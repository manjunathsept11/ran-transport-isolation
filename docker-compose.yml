services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - na_data:/data
      - na_reports:/reports
    environment:
      NA_DATA_DIR: /data
      NA_REPORTS_DIR: /reports

  jupyter:
    build: .
    command: >
      sh -c "uv pip install --system jupyterlab &&
             jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
             --NotebookApp.token='' --NotebookApp.password=''"
    ports:
      - "8888:8888"
    volumes:
      - na_data:/data
      - na_reports:/reports
      - ./notebooks:/app/notebooks

volumes:
  na_data:
  na_reports:
