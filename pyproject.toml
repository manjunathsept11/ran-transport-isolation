[project]
name = "networkanalysis"
version = "0.1.0"
description = "RAN & Transport Isolation module - synthetic telecom data generation, correlation, anomaly/variability analysis, and transport-vs-RAN root-cause attribution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manjunath" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "shap>=0.45",
    "ruptures>=1.1.9",
    "networkx>=3.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyterlab>=4.2",
    "seaborn>=0.13",
]

[project.scripts]
na = "networkanalysis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/networkanalysis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008", "E741", "E702", "B905", "B023", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"src/networkanalysis/report/build.py" = ["E402"]
"notebooks/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
